  <rect x="234" y="314" width="44" height="60" rx="4" fill="#071812" stroke="#f59e0b" stroke-width="4" />

  <!-- Explorer compass star crest -->
  <polygon points="256,88 286,210 404,236 286,262 256,356 226,262 108,236 226,210" fill="url(#gold)" />
  <polygon points="256,120 274,218 364,236 274,254 256,324 238,254 148,236 238,218" fill="#fef3c7" opacity="0.42" />
  <circle cx="256" cy="236" r="24" fill="#0b1f18" stroke="#fde047" stroke-width="7" />
